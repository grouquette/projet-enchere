<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Détail Vente</title>
<link rel="stylesheet" href="/css/encheres.css" />
<link rel="stylesheet" th:href="@{/css/formulaires.css}" />
</head>
<body>
<div th:replace="~{fragments/fragments-entete::entete}"></div>
<main>
		 <h1>Detail Vente</h1>

    <form th:action="@{/details}" method="get" th:object="${article}">
        <ul class="flex-outer">
            <li>
                <label for="nomArticle">Nom Article:</label>
                <input id="nomArticle" type="text" th:value="${article.nomArticle}" readonly/>
            </li>
            <li>
                <label for="description">Description : </label>
                <textarea id="description" readonly th:text="${article.description}"></textarea>
            </li>
            <li>
                <label for="libelle">Catégorie</label>
                <input id="libelle" type="text" th:value="${article.categorie.libelle}" readonly/>
            </li>
            <li>
                <label for="maxEnchere">Meilleure offre : </label>
                <input id="maxEnchere" type="text" th:value="${article.prixVente}" readonly/>
            </li>
            <li>
                <label for="miseAPrix">Mise à prix : </label>
                <input id="miseAPrix" type="number" th:value="${article.miseAPrix}" readonly/>
            </li>
            <li>
                <label for="finEnchere">Fin de l'enchère : </label>
                <input id="finEnchere" type="text" th:value="${article.dateFinEncheres}" readonly/>
            </li>
            <li>
                <label for="retrait">Retrait :</label>
                <input id="retrait" type="text" th:value="${article.lieuRetrait.rue} + ' ' + ${article.lieuRetrait.code_postal} + ' ' + ${article.lieuRetrait.ville}" readonly/>
            </li>
            <li>
                <label for="utilisateur">Vendeur :</label>
                <input id="utilisateur" type="text" th:value="${article.utilisateur}" readonly/>
            </li>
            <li>
                <label for="montantEnchere">Ma proposition</label>
                <div class="form-row">
                    <button type="submit" class="btn go">Enchérir</button>
                </div>
            </li>
        </ul>
    </form>
</main>

</body>
</html>
