<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Nouvelle vente</title>
    <link rel="stylesheet" href="/css/encheres.css" />
    <link rel="stylesheet" th:href="@{/css/formulaires.css}" />
</head>
<body>
    <div th:replace="~{fragments/fragments-entete::entete}"></div>
    <h1>Nouvelle vente</h1>
    <form action="/article/creer" method="post" th:object="${article}">
        <ul class="flex-outer">
            <li>
                <label for="nomArticle">Article</label>
                <input id="nomArticle" type="text" th:field="*{nomArticle}" required/>
            </li>
            <li>
                <label for="description">Description :</label>
                <textarea id="description" th:field="*{description}" required></textarea>
            </li>
            <li>
                <label for="categorie">Catégorie :</label>
                <select id="categorie" th:field="*{categorie}">
                    <option th:each="categorie : ${categories}" th:value="${categorie.noCategorie}" th:text="${categorie.libelle}"></option>
                </select>
            </li>
            <li>
                <label for="miseAPrix">Mise à prix :</label>
                <select id="miseAPrix" th:field="*{miseAPrix}">
                    <option th:each="prix : ${prixList}" th:value="${prix}" th:text="${prix}"></option>
                </select>
            </li>
            <li>
                <label for="dateDebutEncheres">Début des enchères :</label>
                <input id="dateDebutEncheres" type="datetime-local" th:field="*{dateDebutEncheres}" required/>
            </li>
            <li>
                <label for="dateFinEncheres">Fin des enchères :</label>
                <input id="dateFinEncheres" type="datetime-local" th:field="*{dateFinEncheres}" required/>
            </li>
            <li>
                <label for="lieuRetrait">Retrait :</label>
                <input id="rue" type="text" th:field="*{lieuRetrait.rue}" required/>
                <input id="code_postal" type="text" th:field="*{lieuRetrait.code_postal}" required/>
                <input id="ville" type="text" th:field="*{lieuRetrait.ville}" required/>
            </li>
        </ul>
        <div class="form-row">
            <button type="submit" class="btn go">Enregistrer</button>
            <a href="/encheres" class="btn cncl">Annuler</a>
        </div>
    </form>
</body>
</html>
